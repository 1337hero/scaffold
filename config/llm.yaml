# LLM routing config
# Maps runtime routes to provider/model profiles.

version: 1

providers:
  anthropic_main:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    timeout_seconds: 30

profiles:
  # Conversational — what Mike actually talks to. Don't cheap out.
  respond_sonnet:
    provider: anthropic_main
    model: claude-sonnet-4-6

  # Background tasks — classification, summarization, structured output.
  background_haiku:
    provider: anthropic_main
    model: claude-haiku-4-5-20251001

routes:
  brain.respond:
    profile: respond_sonnet
    required: false

  cortex.bulletin:
    profile: background_haiku
    required: false

startup:
  verify_required_routes: false
  warmup_routes: []