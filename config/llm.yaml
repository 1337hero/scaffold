# LLM routing config
# Maps runtime routes to provider/model profiles.

version: 1

providers:
  anthropic_main:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    timeout_seconds: 30

  llama_cpp:
    type: openai_compatible
    base_url: http://127.0.0.1:8080/v1
    timeout_seconds: 60
    supports_tool_use: false

profiles:
  # Conversational — what Mike actually talks to. Don't cheap out.
  respond_sonnet:
    provider: anthropic_main
    model: claude-sonnet-4-6

  # Background LLM work — runs locally via llama.cpp (llama-server).
  # Saves cloud spend; only brain.respond uses Sonnet.
  background_llama:
    provider: llama_cpp
    model: qwen2.5-7b-instruct

routes:
  brain.respond:
    profile: respond_sonnet
    required: false

  cortex.bulletin:
    profile: background_llama
    required: false

  cortex.semantic:
    profile: background_llama
    required: false

startup:
  verify_required_routes: false
  warmup_routes: []