# Agent tool definitions — what tools the agent can call during conversation
# These map to Go functions in brain/tools.go

tools:
  - name: search_memories
    description: Search the knowledge graph for memories matching a query.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query to match against memory content and titles
        type:
          type: string
          description: Optional memory type filter (Todo, Goal, Decision, etc)
      required: [query]

  - name: get_calendar_events
    description: |
      Check the user's Google Calendar. Use to answer schedule questions,
      check availability, or see what's coming up today.
    input_schema:
      type: object
      properties:
        scope:
          type: string
          enum: [today, upcoming]
          description: "'today' for full day, 'upcoming' for next few hours"
        hours:
          type: integer
          description: "Hours to look ahead when scope is 'upcoming'. Range 1-24, default 4. Ignored for 'today'."
          minimum: 1
          maximum: 24
      required: [scope]

  - name: create_task
    description: |
      Create a new task. Tasks are concrete action items.
    input_schema:
      type: object
      properties:
        title:
          type: string
          description: Task title
        domain:
          type: string
          description: "Life domain"
        context:
          type: string
          description: Additional context or notes
        due_date:
          type: string
          description: "Due date (YYYY-MM-DD)"
        recurring:
          type: string
          enum: [daily, weekly, monthly]
          description: Recurrence schedule
        priority:
          type: string
          enum: [high, normal, low]
          description: "Priority level. Default: normal"
      required: [title]

  - name: create_note
    description: |
      Create a note. Notes capture freeform information, ideas, or reference material.
    input_schema:
      type: object
      properties:
        title:
          type: string
          description: Note title
        domain:
          type: string
          description: "Life domain"
        content:
          type: string
          description: Note body content
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization
      required: [title]

  - name: update_task
    description: |
      Update an existing task. Pass only the fields you want to change.
      Set status to "done" to complete (handles recurring reset automatically).
    input_schema:
      type: object
      properties:
        id:
          type: string
          description: Task ID
        title:
          type: string
        domain:
          type: string
          description: "Life domain name"
        context:
          type: string
        due_date:
          type: string
          description: "YYYY-MM-DD"
        recurring:
          type: string
          enum: [daily, weekly, monthly]
        priority:
          type: string
          enum: [high, normal, low]
        status:
          type: string
          enum: [pending, in_progress, done, deleted]
      required: [id]

  - name: list_tasks
    description: |
      List tasks with optional filters. Use due filter to scope by time.
    input_schema:
      type: object
      properties:
        domain:
          type: string
          description: "Filter by life domain name"
        status:
          type: string
          description: "Filter by status (default: pending)"
        due:
          type: string
          enum: [today, tomorrow, week]
          description: "Filter by due date window"

  - name: create_calendar_event
    description: |
      Create a new event on Google Calendar.
      Use when Mike asks to schedule something, set up a meeting, or block time.
    input_schema:
      type: object
      properties:
        title:
          type: string
          description: Event title / summary
        start:
          type: string
          description: "Start time in RFC3339 format (e.g. 2026-02-25T14:00:00-07:00)"
        end:
          type: string
          description: "End time in RFC3339 format"
        location:
          type: string
          description: Optional location or video link
        description:
          type: string
          description: Optional event description or notes
      required: [title, start, end]

  - name: update_calendar_event
    description: |
      Update an existing Google Calendar event by ID.
      Pass only the fields you want to change.
    input_schema:
      type: object
      properties:
        event_id:
          type: string
          description: Google Calendar event ID (from get_calendar_events)
        title:
          type: string
        start:
          type: string
          description: "New start time in RFC3339 format"
        end:
          type: string
          description: "New end time in RFC3339 format"
        location:
          type: string
        description:
          type: string
      required: [event_id]